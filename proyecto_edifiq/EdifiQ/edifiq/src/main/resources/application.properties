spring.application.name=edifiq
spring.datasource.url=jdbc:mysql://localhost:3306/edifiq
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Carpeta donde se guardan las fotos de los comprobantes de pago (se crea sola si no existe)
app.uploads.comprobantes-dir=uploads/comprobantes
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB